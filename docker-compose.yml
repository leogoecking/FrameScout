services:
  db:
    image: postgres:16-alpine
    container_name: framescout_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-framescout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-framescout_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-framescout_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-framescout} -d ${POSTGRES_DB:-framescout_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: framescout_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-framescout}:${POSTGRES_PASSWORD:-framescout_dev_password}@db:5432/${POSTGRES_DB:-framescout_db}
      ENVIRONMENT: development
      DEBUG: "true"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: framescout_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: framescout_worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/worker:/app

volumes:
  postgres_data:
